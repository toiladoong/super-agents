<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--orca-background);
        color: var(--orca-foreground);
        font: 12px system-ui, sans-serif;
      }
      #office {
        display: block;
        width: 100%;
        image-rendering: pixelated;
      }
      #tip {
        position: fixed;
        pointer-events: none;
        display: none;
        max-width: 240px;
        padding: 6px 8px;
        border-radius: 4px;
        background: rgba(20, 20, 28, 0.92);
        color: #f0f0f0;
        line-height: 1.4;
        white-space: pre-line;
      }
      #open-team {
        position: absolute;
        top: 6px;
        right: 48px;
        padding: 2px 8px;
        border: 1px solid rgba(236, 239, 244, 0.5);
        border-radius: 4px;
        background: rgba(46, 52, 64, 0.85);
        color: #eceff4;
        font: inherit;
        cursor: pointer;
      }
      #open-team:hover {
        background: rgba(76, 86, 106, 0.95);
      }
      #help {
        margin: 4px 10px 12px;
        overflow-wrap: anywhere;
        line-height: 1.5;
      }
      #help summary {
        cursor: pointer;
        opacity: 0.8;
      }
      /* Commands as chips: monospace, accent colour, tinted box, so they stand apart from the prose. */
      #help code {
        padding: 1px 5px;
        border: 1px solid rgba(136, 192, 208, 0.45);
        border-radius: 4px;
        background: rgba(136, 192, 208, 0.16);
        color: #8fd3e8;
        font: 600 12px ui-monospace, Consolas, monospace;
        white-space: nowrap;
      }
      html.light #help code {
        border-color: rgba(29, 78, 137, 0.35);
        background: rgba(29, 78, 137, 0.08);
        color: #1d4e89;
      }
      #help ul,
      #guide-body ul {
        margin: 6px 0;
        padding-left: 18px;
      }
      #corner {
        display: block;
        width: 100%;
        image-rendering: pixelated;
      }
      #corner-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 6px 10px 0;
      }
      #coins {
        align-self: center;
        margin-right: 4px;
      }
      #corner-controls select,
      #corner-controls button {
        font: inherit;
      }
      #corner-info {
        padding: 4px 10px 0;
        opacity: 0.8;
      }
      #status {
        padding: 6px 10px;
        opacity: 0.7;
      }
      /* A reply to a click (open a tab, open team.json) must be seen: show it as a notice. */
      #status:not(:empty) {
        margin: 6px 10px;
        border-left: 3px solid #88c0d0;
        border-radius: 3px;
        background: rgba(136, 192, 208, 0.15);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <button id="open-team">⚙ Team</button>
    <canvas id="office"></canvas>
    <canvas id="corner"></canvas>
    <div id="corner-controls">
      <b id="coins"></b>
      <select id="pet"></select>
      <button id="feed"></button>
      <button id="drink"></button>
      <select id="plant"></select>
      <button id="water"></button>
    </div>
    <div id="corner-info"></div>
    <div id="status"></div>
    <details id="help" open>
      <summary id="guide-title"></summary>
      <div id="guide-body"></div>
    </details>
    <div id="tip"></div>
    <script src="../shared/i18n.js"></script>
    <script src="agents.js"></script>
    <script src="sprites.js"></script>
    <script src="pet-sprites.js"></script>
    <script src="pet-rules.js"></script>
    <script src="pets.js"></script>
    <script src="office.js"></script>
  </body>
</html>

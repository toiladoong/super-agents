<!doctype html>
<!-- Self-check for editor.js: open in a browser (or headless Chrome with --dump-dom); the page title says PASS or FAIL. -->
<html>
  <head><meta charset="utf-8" /><title>running</title></head>
  <body>
    <div id="error"></div>
    <h2 id="language-title"></h2><p id="language-hint"></p><div id="language"></div>
    <h2 id="roles-title"></h2><p id="roles-hint"></p>
    <div id="effort-mode"></div>
    <div id="change" hidden></div>
    <div id="roles"></div>
    <h2 id="environments-title"></h2><p id="environments-hint"></p>
    <div id="environments"></div>
    <button id="add-environment"></button>
    <h2 id="notes-title"></h2><p id="notes-hint"></p>
    <div id="notes"></div>
    <button id="add-note"></button>
    <pre id="out"></pre>
    <script>
      const original = '{\n  "_comment": "keep me",\n  "roles": { "coder": { "agent": "claude", "model": "opus" } },\n  "notes": ["a"]\n}\n'
      let written = original
      window.orca = {
        plugin: { request: async (name) => (name === 'language.get' ? { language: 'vi' } : null) },
        document: {
          session: async ({ decode, encode }) => {
            const session = {
              value: decode({ kind: 'text', text: original }),
              readOnly: false,
              change(next) {
                session.value = next
                written = encode(next).text
              },
              onReplace() {}
            }
            return session
          }
        }
      }
    </script>
    <script src="../shared/i18n.js"></script>
    <script src="../panel/sprites.js"></script>
    <script src="environments.js"></script>
    <script src="editor.js"></script>
    <script>
      setTimeout(() => {
        const failures = []
        const check = (ok, message) => ok || failures.push(message)
        const coderRow = [...document.querySelectorAll('.role')].find((row) => row.querySelector('b').textContent === 'coder')
        check(document.querySelectorAll('.role').length === 5, 'all five roles are listed')
        const agentInput = coderRow.querySelectorAll('select')[0]
        check([...agentInput.options].map((option) => option.value).join() === 'claude,codex,antigravity,cursor,opencode', 'agent is a select of known AIs')
        check([...coderRow.querySelectorAll('select')[1].options].map((option) => option.value).join() === ',opus,sonnet,haiku,__custom__', 'Claude models are offered, plus a custom entry')
        agentInput.value = 'codex'
        agentInput.dispatchEvent(new Event('change'))
        const team = JSON.parse(written)
        check(team.roles.coder.agent === 'codex', 'agent change is written')
        check(!('model' in team.roles.coder), 'a Claude model is dropped when the agent leaves Claude')
        check(team._comment === 'keep me', 'keys the editor does not show are kept')
        const roleRow = (name) => [...document.querySelectorAll('.role')].find((row) => row.querySelector('b').textContent === name)
        const codexModel = roleRow('coder').querySelectorAll('select')[1]
        check([...codexModel.options].some((option) => option.value === 'gpt-6.2-sol'), 'Codex models are offered after switching AI')
        codexModel.value = '__custom__'
        codexModel.dispatchEvent(new Event('change'))
        const customInput = roleRow('coder').querySelector('input')
        customInput.value = 'gpt-9-test'
        customInput.dispatchEvent(new Event('change'))
        check(JSON.parse(written).roles.coder.model === 'gpt-9-test', 'a custom model name can be typed')
        check(roleRow('coder').querySelectorAll('select')[1].value === 'gpt-9-test', 'a custom model shows as its own option')
        const testerAgent = roleRow('tester').querySelectorAll('select')[0]
        testerAgent.value = 'opencode'
        testerAgent.dispatchEvent(new Event('change'))
        check(roleRow('tester').querySelectorAll('select')[1].value === '', 'switching AI resets the model to default')
        const languageSelect = document.querySelector('#language select')
        check(languageSelect.value === 'vi', 'reply language defaults to Vietnamese')
        languageSelect.value = 'en'
        languageSelect.dispatchEvent(new Event('change'))
        check(JSON.parse(written).language === 'en', 'reply language is written to team.json')
        check(document.getElementById('roles-title').textContent === 'Vai trò', 'editor words default to Vietnamese')
        document.getElementById('add-note').click()
        check(JSON.parse(written).notes.length === 2, 'a note can be added')
        document.querySelector('.note button').click()
        check(JSON.stringify(JSON.parse(written).notes) === '[""]', 'a note can be removed')
        check(written.endsWith('}\n') && written.includes('\n  "roles"'), 'file is written as 2-space JSON')

        // Test environments: added as develop, staging, production in turn; renamed and re-pointed in place; removed.
        const addEnvironment = () => document.getElementById('add-environment').click()
        addEnvironment()
        addEnvironment()
        check(Object.keys(JSON.parse(written).environments).join() === 'develop,staging', 'environments are added with the usual names')
        const rows = () => document.querySelectorAll('.environment')
        const [nameInput, urlInput] = rows()[0].querySelectorAll('input')
        urlInput.value = 'https://develop-web.example.vn'
        urlInput.dispatchEvent(new Event('change'))
        nameInput.value = 'dev'
        nameInput.dispatchEvent(new Event('change'))
        check(JSON.stringify(JSON.parse(written).environments) === '{"dev":"https://develop-web.example.vn","staging":""}', 'a rename keeps the URL and the order')
        rows()[1].querySelector('button').click()
        check(Object.keys(JSON.parse(written).environments).join() === 'dev', 'an environment can be removed')
        addEnvironment()
        const renamed = rows()[1].querySelector('input')
        renamed.value = 'dev'
        renamed.dispatchEvent(new Event('change'))
        check(JSON.stringify(JSON.parse(written).environments) === '{"dev":"https://develop-web.example.vn","develop":""}', 'a rename onto a taken name is refused, keeping both URLs')
        check(rows()[1].querySelector('input').value === 'develop', 'the refused name goes back to the old one')
        const spaced = rows()[1].querySelector('input')
        spaced.value = 'dev 2'
        spaced.dispatchEvent(new Event('change'))
        check('develop' in JSON.parse(written).environments, 'a name with a space is refused')

        // An AI change is told, and can be undone: a stray key on a focused select changes it silently.
        // Give the tester a model first, so an Undo that drops it shows.
        const testerSelects = () => roleRow('tester').querySelectorAll('select')
        testerSelects()[0].value = 'claude'
        testerSelects()[0].dispatchEvent(new Event('change'))
        testerSelects()[1].value = 'sonnet'
        testerSelects()[1].dispatchEvent(new Event('change'))
        const testerBefore = JSON.stringify(JSON.parse(written).roles.tester)
        const testerAi = roleRow('tester').querySelector('select')
        testerAi.value = 'antigravity'
        testerAi.dispatchEvent(new Event('change'))
        const notice = document.getElementById('change')
        check(!notice.hidden && notice.textContent.includes('tester') && notice.textContent.includes('antigravity'), 'an AI change is shown')
        notice.querySelector('button').click()
        check(JSON.stringify(JSON.parse(written).roles.tester) === testerBefore && notice.hidden, 'undo puts the old AI and model back')
        testerAi.value = 'cursor'
        testerAi.dispatchEvent(new Event('change'))
        roleRow('tester').querySelectorAll('select')[1].dispatchEvent(new Event('change'))
        check(notice.hidden, 'a later edit retires the notice and its Undo')

        // Effort: per role (empty = picked per ticket), levels follow the AI, an AI change drops it, and a repo-wide mode.
        const reviewerSelects = () => roleRow('reviewer').querySelectorAll('select')
        reviewerSelects()[0].value = 'claude'
        reviewerSelects()[0].dispatchEvent(new Event('change'))
        check([...reviewerSelects()[2].options].map((option) => option.value).join() === ',low,medium,high,xhigh,max', 'Claude effort levels are offered, empty = per ticket')
        reviewerSelects()[2].value = 'high'
        reviewerSelects()[2].dispatchEvent(new Event('change'))
        check(JSON.parse(written).roles.reviewer.effort === 'high', 'a fixed effort is written')
        reviewerSelects()[0].value = 'opencode'
        reviewerSelects()[0].dispatchEvent(new Event('change'))
        check(!('effort' in JSON.parse(written).roles.reviewer), 'an AI change drops the effort')
        check(reviewerSelects()[2].disabled, 'an AI without effort levels gets a disabled box')
        reviewerSelects()[0].value = 'cursor'
        reviewerSelects()[0].dispatchEvent(new Event('change'))
        check(reviewerSelects()[2].disabled && reviewerSelects()[2].title === window.officeI18n.t.effortNeedsModel, 'another AI with no model: the effort box waits for a model')
        reviewerSelects()[1].append(new Option('cursor-x', 'cursor-x'))
        reviewerSelects()[1].value = 'cursor-x'
        reviewerSelects()[1].dispatchEvent(new Event('change'))
        check(!reviewerSelects()[2].disabled, 'with a model, the effort box opens')
        reviewerSelects()[2].value = 'high'
        reviewerSelects()[2].dispatchEvent(new Event('change'))
        reviewerSelects()[1].value = ''
        reviewerSelects()[1].dispatchEvent(new Event('change'))
        check(!('effort' in JSON.parse(written).roles.reviewer), 'back to the default model, its effort goes too')
        const mode = document.querySelector('#effort-mode select')
        check(mode.value === 'auto', 'effort is picked per ticket by default')
        mode.value = 'off'
        mode.dispatchEvent(new Event('change'))
        check(JSON.parse(written).effort === 'off', 'effort can be turned off for the repo')
        document.getElementById('out').textContent = failures.length ? failures.join('\n') : 'all checks passed'
        document.title = failures.length ? 'FAIL' : 'PASS'
      }, 300)
    </script>
  </body>
</html>
